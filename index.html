<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ポータル - さいきよ経済圏</title>
<style>
  :root {
    --bg-color: #FDFBF6;
    --text-color: #1A1A1A;
    --btn-bg: #EAE6DF;
  }

  body {
    margin: 0; padding: 0;
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 20px;
    box-sizing: border-box;
  }

  .portal-container {
    width: 100%;
    max-width: 400px;
  }

  h1 {
    text-align: center;
    font-size: 1.5rem;
    margin-bottom: 40px;
    letter-spacing: 4px;
    border-bottom: 1px solid var(--text-color);
    padding-bottom: 10px;
  }

  .menu-list {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .menu-item {
    display: block;
    text-decoration: none;
    background: var(--btn-bg);
    color: var(--text-color);
    padding: 20px;
    border-radius: 8px;
    text-align: center;
    border: 1px solid var(--text-color);
    box-shadow: 3px 3px 0px rgba(0,0,0,0.1);
    transition: transform 0.1s, box-shadow 0.1s;
  }

  .menu-item:active {
    transform: translate(2px, 2px);
    box-shadow: none;
  }

  .menu-title {
    display: block;
    font-size: 1.3rem;
    font-weight: bold;
    margin-bottom: 5px;
  }

  .menu-desc {
    display: block;
    font-size: 0.85rem;
    color: #555;
  }
</style>
</head>
<body>

<div class="portal-container">
  <h1>ポータル</h1>
  
  <div class="menu-list">
    <a href="saikiyo2.html" class="menu-item">
      <span class="menu-title">海（さいきよ2）</span>
      <span class="menu-desc">閲覧・推敲・タグ管理・増殖</span>
    </a>
    
    <a href="rensaku.html" class="menu-item">
      <span class="menu-title">机（れんさく）</span>
      <span class="menu-desc">タロットカードの展開と物理D&D</span>
    </a>
    
    <a href="tategaki.html" class="menu-item">
      <span class="menu-title">アトリエ（たてがき）</span>
      <span class="menu-desc">縦書き画像への視覚定着</span>
    </a>
    
    <a href="data-manage.html" class="menu-item">
      <span class="menu-title">管理局</span>
      <span class="menu-desc">データのインポートと物理削除(GC)</span>
    </a>
    
    <a href="mail-sync.html" class="menu-item">
      <span class="menu-title">公証の金庫</span>
      <span class="menu-desc">自分宛てメールによる絶対タイムスタンプ</span>
    </a>
  </div>
</div>

</html>
