<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>さいきよ2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <button id="btn-left-wing" class="header-wing-btn">表示</button>
    <button id="btn-top">さいきよ2</button>
    <button id="btn-right-wing" class="header-wing-btn">管制</button>
  </header>

  <main id="timeline"></main>

  <div id="footer-bar">
    <div id="footer-normal">
      <span class="footer-title">さいきよ2</span>
      <button id="btn-fab">＋</button>
    </div>
    <div id="footer-selection" style="display: none;">
      <span id="selection-count">0件選択中</span>
      <div class="footer-right">
        <button id="btn-batch-edit">一括編集</button>
        <button id="btn-to-desk">机へ</button>
        <button id="btn-cancel-selection">取消</button>
      </div>
    </div>
  </div>

  <div id="console-area">
    <textarea id="input-content" rows="1" placeholder="本文を入力..."></textarea>
    <div class="console-bottom">
      <button id="btn-search" class="console-btn-icon">検</button>
      <textarea id="input-tags" placeholder="タグ（#作品 等）"></textarea>
      <button id="btn-send" class="console-btn-icon">送</button>
    </div>
  </div>

  <!-- 中央2層：プロパティ編集パネル -->
  <div id="panel-edit" class="panel panel-full">
    <div class="panel-header">
      <h2>プロパティ編集</h2>
      <button id="btn-close-edit">戻る</button>
    </div>

    <div class="edit-group" id="edit-timestamp-group">
      <label>作成日</label>
      <div id="edit-timestamp" class="edit-meta-box"></div>
    </div>

    <div class="edit-readonly" id="edit-content-view" style="margin-bottom:15px; padding:10px; background:#f0f0f0; font-size:1.1rem; white-space:pre-wrap;"></div>
    
    <div class="edit-group">
      <label>メモ</label>
      <textarea id="edit-memo" placeholder="あとから書き換え自由"></textarea>
    </div>
    
    <div class="edit-group">
      <label>タグ</label>
      <textarea id="edit-tags" placeholder="#を自動で付与、あとから追加削除自由"></textarea>
      <div class="tag-helpers">
        <button class="helper-tag">#作品</button>
        <button class="helper-tag">#メモ</button>
        <button class="helper-tag">#アーカイブ</button>
        <button class="helper-tag">#ゴミ</button>
        <button class="helper-tag">#未発表</button>
        <button class="helper-tag">#既発表</button>
      </div>
    </div>

    <div class="edit-actions-stack">
      <div class="edit-actions">
        <button id="btn-delete-edit" class="btn-danger">削除</button>
        <button id="btn-copy-edit" class="btn-secondary">コピペ</button>
      </div>
      <div class="edit-actions">
        <button id="btn-shelf-edit" class="btn-secondary">棚に収める</button>
        <button id="btn-save-edit" class="btn-primary">変更</button>
      </div>
    </div>
  </div>

  <!-- 左舷1枚目：表示パネル（仮枠） -->
  <div id="panel-display" class="panel panel-wing">
    <div class="panel-header">
      <h2>表示パネル</h2>
      <button class="btn-close-wing">閉じる</button>
    </div>
    <p class="panel-placeholder-note">タグ絞り込み・カレンダー・表示切替をここに実装予定ロボ。</p>
  </div>

  <!-- 左舷2枚目：コンフィグパネル（仮枠） -->
  <div id="panel-config" class="panel panel-wing">
    <div class="panel-header">
      <h2>コンフィグ</h2>
      <button class="btn-close-wing">閉じる</button>
    </div>
    <p class="panel-placeholder-note">カラーモード（銀鼠等）・文字サイズ・角丸設定をここに実装予定ロボ。</p>
  </div>

  <!-- 右舷1枚目：管制パネル（仮枠） -->
  <div id="panel-kansei" class="panel panel-wing">
    <div class="panel-header">
      <h2>管制パネル</h2>
      <button class="btn-close-wing">閉じる</button>
    </div>
    <p class="panel-placeholder-note">JSON射出（自分宛て共有）・回収・タグ/日付の部分撤収をここに実装予定ロボ。</p>
  </div>

  <!-- 右舷2枚目：リスト棚パネル -->
  <div id="panel-shelf" class="panel panel-wing">
    <div id="shelf-list-view">
      <div class="panel-header">
        <h2>リスト棚</h2>
        <div class="panel-header-actions">
          <button id="btn-shelf-bulk-delete" style="display: none;">選択削除</button>
          <button class="btn-close-wing">閉じる</button>
        </div>
      </div>
      <div id="shelf-list"></div>
    </div>

    <!-- リスト棚：詳細ビュー -->
    <div id="shelf-detail-view" style="display: none;">
      <div class="panel-header">
        <h2 id="shelf-detail-title">リスト詳細</h2>
        <button id="btn-shelf-back-list">棚一覧へ</button>
      </div>
      <div id="shelf-detail-meta" class="shelf-detail-meta"></div>
      <div id="shelf-detail-memo" class="shelf-detail-memo"></div>
      <div id="shelf-detail-items" class="shelf-detail-items"></div>
      <div class="shelf-detail-actions">
        <button id="btn-shelf-copy" class="shelf-act-btn secondary">全文コピー</button>
        <div class="shelf-detail-return-row">
          <button id="btn-shelf-return-scatter" class="shelf-act-btn primary">バラでTLへ</button>
          <button id="btn-shelf-return-block" class="shelf-act-btn primary">塊でTLへ</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
