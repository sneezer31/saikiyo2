<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>さいきよ2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-left">
      <button id="btn-config">≡</button>
      <button id="btn-calendar">📅</button>
      <button id="btn-kansei">管制</button>
    </div>
    <button id="btn-top">さいきよ</button>
  </header>

  <main id="timeline"></main>

  <div id="footer-bar">
    <div id="footer-normal">
      <span class="footer-title">さいきよ2</span>
      <button id="btn-fab">＋</button>
    </div>
    <div id="footer-selection" style="display: none;">
      <span id="selection-count">0件選択中</span>
      <div class="footer-right">
        <button id="btn-batch-edit">一括編集</button>
        <button id="btn-to-desk">机へ</button>
        <button id="btn-cancel-selection">取消</button>
      </div>
    </div>
  </div>

  <div id="console-area">
    <textarea id="input-content" rows="1" placeholder="本文を入力..."></textarea>
    <div class="console-bottom">
      <button id="btn-search" class="console-btn-icon">検</button>
      <textarea id="input-tags" placeholder="タグ（#作品 等）"></textarea>
      <button id="btn-send" class="console-btn-icon">送</button>
    </div>
  </div>

  <div id="panel-edit" class="panel">
    <div class="panel-header">
      <h2>プロパティ編集</h2>
      <button id="btn-close-edit">戻る</button>
    </div>
    <div id="edit-timestamp"></div>
    <div class="edit-readonly" id="edit-content-view" style="margin-bottom:15px; padding:10px; background:#f0f0f0; font-size:1.1rem; white-space:pre-wrap;"></div>
    
    <div class="edit-group">
      <label>メモ</label>
      <textarea id="edit-memo" placeholder="あとから書き換え自由"></textarea>
    </div>
    
    <div class="edit-group">
      <label>タグ</label>
      <textarea id="edit-tags" placeholder="#を自動で付与、あとから追加削除自由"></textarea>
      <div class="tag-helpers">
        <button class="helper-tag">#作品</button>
        <button class="helper-tag">#アーカイブ</button>
        <button class="helper-tag">#ゴミ</button>
        <button class="helper-tag">#未発表</button>
        <button class="helper-tag">#既発表</button>
      </div>
    </div>

    <div class="edit-actions">
      <button id="btn-delete-edit" class="btn-danger">削除</button>
      <button id="btn-copy-edit" class="btn-secondary">コピペ</button>
      <button id="btn-save-edit" class="btn-primary">変更</button>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
