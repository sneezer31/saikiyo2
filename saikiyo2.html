<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>さいきよ2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <button id="btn-left-wing" class="header-wing-btn">表示</button>
    <div class="header-right-group">
      <button id="btn-top">さいきよ2</button>
      <button id="btn-right-wing" class="header-wing-btn">管制</button>
    </div>
  </header>

  <main id="timeline"></main>

  <div id="footer-bar">
    <div id="footer-normal">
      <button id="btn-open-shelf" class="footer-shelf-btn">棚</button>
      <button id="btn-fab">＋</button>
    </div>
    <div id="footer-selection" style="display: none;">
      <span id="selection-count">0件選択中</span>
      <div class="footer-right">
        <button id="btn-batch-edit">一括編集</button>
        <button id="btn-to-desk">机へ</button>
        <button id="btn-cancel-selection">取消</button>
      </div>
    </div>
  </div>

  <div id="console-area">
    <textarea id="input-content" rows="1" placeholder="本文を入力..."></textarea>
    <div class="console-bottom">
      <button id="btn-search" class="console-btn-icon">検</button>
      <textarea id="input-tags" placeholder="タグ（#作品 等）"></textarea>
      <button id="btn-send" class="console-btn-icon">送</button>
    </div>
  </div>

  <!-- 中央2層：プロパティ編集パネル -->
  <div id="panel-edit" class="panel panel-full">
    <div class="panel-header">
      <h2>プロパティ編集</h2>
      <button id="btn-close-edit">戻る</button>
    </div>

    <div class="edit-group" id="edit-timestamp-group">
      <label>作成日</label>
      <div id="edit-timestamp" class="edit-meta-box"></div>
    </div>

    <div class="edit-readonly" id="edit-content-view" style="margin-bottom:15px; padding:10px; font-size:1.1rem; white-space:pre-wrap;"></div>
    
    <div class="edit-group">
      <label>メモ</label>
      <textarea id="edit-memo" placeholder="あとから書き換え自由"></textarea>
    </div>
    
    <div class="edit-group">
      <label>タグ</label>
      <textarea id="edit-tags" placeholder="#を自動で付与、あとから追加削除自由"></textarea>
      <div class="tag-helpers">
        <button class="helper-tag">#作品</button>
        <button class="helper-tag">#メモ</button>
        <button class="helper-tag">#アーカイブ</button>
        <button class="helper-tag">#ゴミ</button>
        <button class="helper-tag">#未発表</button>
        <button class="helper-tag">#既発表</button>
      </div>
    </div>

    <div class="edit-actions-stack">
      <div class="edit-actions">
        <button id="btn-delete-edit" class="btn-danger">削除</button>
        <button id="btn-copy-edit" class="btn-secondary">コピペ</button>
      </div>
      <div class="edit-actions">
        <button id="btn-shelf-edit" class="btn-secondary">棚に収める</button>
        <button id="btn-save-edit" class="btn-primary">変更</button>
      </div>
    </div>
  </div>

  <!-- 左舷1枚目：表示パネル -->
  <div id="panel-display" class="panel panel-wing">
    <div class="panel-header">
      <h2>表示と絞り込み</h2>
      <div class="panel-header-actions">
        <button id="btn-display-reset">絞り込み解除</button>
        <button class="btn-close-wing">閉じる</button>
      </div>
    </div>

    <div id="display-status" class="panel-status-bar">全件表示中</div>

    <section class="wing-section">
      <h3>タグで絞り込み（複数選択可）</h3>
      <div id="display-tag-list" class="filter-chip-group"></div>
    </section>

    <section class="wing-section">
      <h3>期間で絞り込み</h3>
      <div class="date-range-row">
        <input type="date" id="filter-date-from" class="wing-input">
        <span class="date-range-sep">〜</span>
        <input type="date" id="filter-date-to" class="wing-input">
      </div>
    </section>

    <section class="wing-section">
      <h3>並び順</h3>
      <div class="seg-group">
        <button type="button" class="seg-btn active" data-sort="asc">古い順（下が最新）</button>
        <button type="button" class="seg-btn" data-sort="desc">新しい順（上が最新）</button>
      </div>
    </section>

    <section class="wing-section">
      <h3>タイムラインのメモ表示</h3>
      <div class="seg-group">
        <button type="button" class="seg-btn active" data-memo-mode="badge">マークのみ</button>
        <button type="button" class="seg-btn" data-memo-mode="full">本文も表示</button>
      </div>
    </section>
  </div>

  <!-- 左舷2枚目：設定パネル -->
  <div id="panel-config" class="panel panel-wing">
    <div class="panel-header">
      <h2>表示設定</h2>
      <button class="btn-close-wing">閉じる</button>
    </div>

    <section class="wing-section">
      <h3>配色テーマ</h3>
      <div class="seg-group">
        <button type="button" class="seg-btn" data-config-theme="kinari">生成り</button>
        <button type="button" class="seg-btn" data-config-theme="ginnezumi">銀鼠</button>
        <button type="button" class="seg-btn" data-config-theme="sumi">墨（ダーク）</button>
      </div>
    </section>

    <section class="wing-section">
      <h3>文字サイズ</h3>
      <div class="seg-group">
        <button type="button" class="seg-btn" data-config-size="small">小</button>
        <button type="button" class="seg-btn" data-config-size="medium">標準</button>
        <button type="button" class="seg-btn" data-config-size="large">大</button>
      </div>
    </section>

    <section class="wing-section">
      <h3>書体</h3>
      <div class="seg-group">
        <button type="button" class="seg-btn" data-config-font="gothic">ゴシック</button>
        <button type="button" class="seg-btn" data-config-font="mincho">明朝</button>
      </div>
    </section>

    <section class="wing-section">
      <h3>ボタンや枠の角丸</h3>
      <div class="seg-group">
        <button type="button" class="seg-btn" data-config-radius="none">なし</button>
        <button type="button" class="seg-btn" data-config-radius="soft">あり</button>
      </div>
    </section>
  </div>

  <!-- 右舷：管制パネル -->
  <div id="panel-kansei" class="panel panel-wing">
    <div class="panel-header">
      <h2>管制パネル</h2>
      <button class="btn-close-wing">閉じる</button>
    </div>

    <div id="kansei-stats" class="panel-status-bar">読み込み中...</div>

    <section class="wing-section">
      <h3>データ射出（バックアップ）</h3>
      <p class="kansei-desc">全カードとリスト棚を丸ごとJSON形式で書き出します。</p>
      <div class="kansei-btn-row">
        <button id="btn-export-file" class="kansei-btn primary">JSONファイル保存</button>
        <button id="btn-export-copy" class="kansei-btn secondary">テキストをコピー</button>
      </div>
    </section>

    <section class="wing-section">
      <h3>データ回収（復元・統合）</h3>
      <p class="kansei-desc">既存データは消さず、ID単位で統合（マージ）します。</p>
      <div class="kansei-btn-row">
        <button id="btn-import-file" class="kansei-btn secondary">JSONファイルから回収</button>
        <input type="file" id="input-import-file" accept=".json,application/json" style="display: none;">
      </div>
      <textarea id="input-import-text" class="kansei-textarea" rows="3" placeholder="コピーしたJSONテキストをここに貼り付けて回収することもできます"></textarea>
      <button id="btn-import-text" class="kansei-btn secondary full-width">貼り付けテキストから回収</button>
    </section>

    <section class="wing-section">
      <h3>掃除・部分撤収（カード削除）</h3>
      <div class="kansei-clean-block">
        <label>タグで一括撤収</label>
        <div class="kansei-clean-row">
          <input type="text" id="input-clean-tag" class="wing-input" placeholder="例: #ゴミ">
          <button id="btn-clean-tag" class="kansei-btn danger">撤収</button>
        </div>
        <div class="kansei-tag-chips">
          <button type="button" class="kansei-chip" data-tag="#ゴミ">#ゴミ</button>
          <button type="button" class="kansei-chip" data-tag="#アーカイブ">#アーカイブ</button>
          <button type="button" class="kansei-chip" data-tag="#既発表">#既発表</button>
        </div>
      </div>

      <div class="kansei-clean-block">
        <label>指定日より前のカードを一括撤収</label>
        <div class="kansei-clean-row">
          <input type="date" id="input-clean-date" class="wing-input">
          <button id="btn-clean-date" class="kansei-btn danger">撤収</button>
        </div>
      </div>
    </section>
  </div>

  <!-- リスト棚パネル（フッター左から直行） -->
  <div id="panel-shelf" class="panel panel-wing">
    <div id="shelf-list-view">
      <div class="panel-header">
        <h2>リスト棚</h2>
        <div class="panel-header-actions">
          <button id="btn-shelf-bulk-delete" style="display: none;">選択削除</button>
          <button class="btn-close-wing">閉じる</button>
        </div>
      </div>
      <div id="shelf-list"></div>
    </div>

    <!-- リスト棚：詳細ビュー -->
    <div id="shelf-detail-view" style="display: none;">
      <div class="panel-header">
        <h2 id="shelf-detail-title">リスト詳細</h2>
        <button id="btn-shelf-back-list">棚一覧へ</button>
      </div>
      <div id="shelf-detail-meta" class="shelf-detail-meta"></div>
      <div id="shelf-detail-memo" class="shelf-detail-memo"></div>
      <div id="shelf-detail-items" class="shelf-detail-items"></div>
      <div class="shelf-detail-actions">
        <button id="btn-shelf-copy" class="shelf-act-btn secondary">全文コピー</button>
        <div class="shelf-detail-return-row">
          <button id="btn-shelf-return-scatter" class="shelf-act-btn primary">バラでTLへ</button>
          <button id="btn-shelf-return-block" class="shelf-act-btn primary">塊でTLへ</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
